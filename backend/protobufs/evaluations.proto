syntax = "proto3";

package runtimePackage;

message Element {
    string html_code = 1;
    string pointer = 2;
    float x = 3;
    float y = 4;
    float width = 5;
    float height = 6;
}

message Result {
    string verdict = 1;
    string description = 2;
    repeated Element elements = 3;
    int32 elements_quantity = 4;
    string result_code = 5;
}

message SuccessCriteria {
    string name = 1;
    string level = 2;
    string principle = 3;
    string url = 4;
}

message AssertionMetadata {
    string code = 1;
    string name = 2;
    string description = 3;
    string url = 4;
    string mapping = 5;
    repeated string target_elements = 6;
    repeated string target_attributes = 7;
    repeated SuccessCriteria success_criteria = 8;
    int32 success_criteria_quantity = 9;
    repeated Result results = 10;
    int32 results_quantity = 11;
}

message Assertion {
    int32 passed = 1;
    int32 warning = 2;
    int32 failed = 3;
    int32 inapplicable = 4;
    string outcome = 5;
    string description = 6;
    AssertionMetadata metadata = 7;
}

message Module {
    string type = 1;
    int32 passed = 2;
    int32 warning = 3;
    int32 failed = 4;
    int32 inapplicable = 5;
    repeated Assertion assertions = 6;
    int32 assertions_quantity = 7;
}

message AddEvaluationRequest {
    string qualweb_version = 1;
    string input_url = 2;
    string complete_url = 3;
    string dom = 4;
    string title = 5;
    int32 element_count = 6;
    int32 passed = 7;
    int32 warning = 8;
    int32 failed = 9;
    int32 inapplicable = 10;
    repeated Module modules = 11;
    int32 modules_quantity = 12;
    int32 monitored_website_id = 13;
    int32 monitoring_cycle_id = 14;
    bytes screenshot = 15;
}

message AddEvaluationResponse {
    int32 status_code = 1;
}

message AddMonitoringRegistryRequest {
    string main_url = 1;
    string domain_name = 2;
    bool is_mobile = 3;
    bool is_landscape = 4;
    int32 display_width = 5;
    int32 display_height = 6;
    repeated string webpages = 7;
    string website_name = 8;
    int32 user_id = 9;
}

message AddMonitoringRegistryResponse {
    int32 status_code = 1;
    int32 monitoring_registry_id = 2;
}

message GetMonitoredWebsitesRequest {
}

message GetMonitoredWebsitesResponse {
    int32 status_code = 1;
    repeated string websites = 2;
}

message SetAccessibilityMetricRequest {
    int32 monitoring_registry_id = 1;
    string accessibility_metric = 2;
}

message SetAccessibilityMetricResponse {
    int32 status_code = 1;
}

message CalculateAccessibilityScoreRequest {
    int32 monitoring_registry_id = 1;
}

message CalculateAccessibilityScoreResponse {
    int32 status_code = 1;
    float accessibility_score = 2;
}

message SetLatestEvaluationRequest {
    int32 monitoring_registry_id = 1;
}

message SetLatestEvaluationResponse {
    int32 status_code = 1;
}

message AddWebpagesRequest {
    int32 monitoring_registry_id = 1;
    repeated string webpages = 2;
}

message AddWebpagesResponse {
    int32 status_code = 1;
}

message SetAccessibilityMetricAllWebsitesRequest {
    string accessibility_metric = 1;
}

message SetAccessibilityMetricAllWebsitesResponse {
    int32 status_code = 1;
}

message GetLatestAssertionsByWebpageRequest {
    int32 monitoring_registry_id = 1;
}

message GetLatestAssertionsByWebpageResponse {
    int32 status_code = 1;
    repeated WebpageResponse webpages = 2;
}

message WebpageResponse {
    string url = 1;
    repeated AssertionResponse assertions = 2;
}

message AssertionMetadataResponse {
    int32 id = 1;
    string code = 2;
    string name = 3;
    string description = 4;
    string url = 5;
    string mapping = 6;
    repeated string target_elements = 7;
    repeated string target_attributes = 8;
    repeated SuccessCriteria success_criteria = 9;
    int32 success_criteria_quantity = 10;
}

message IssueResponse {
    int32 id = 1;
    int32 assertion_id = 2;
    string verdict = 3;
    string description = 4;
    string result_code = 5;
    repeated IssueElementResponse elements = 6;
}

message IssueElementResponse {
    int32 id = 1;
    string html_code = 2;
    string pointer = 3;
    float x = 4;
    float y = 5;
    float width = 6;
    float height = 7;
    int32 evaluation_id = 8;
    string webpage_url = 9;
}

message GetLatestAssertionsByTestRequest {
    int32 monitoring_registry_id = 1;
}

message GetLatestAssertionsByTestResponse {
    int32 status_code = 1;
    repeated AssertionResponse assertions = 2;
}

message GetCurrentWarningsRequest {
    int32 monitoring_registry_id = 1;
}

message GetCurrentWarningsResponse {
    int32 status_code = 1;
    repeated AssertionResponse warnings = 2;
}

message GetWebsiteScoreRequest {
    int32 monitoring_registry_id = 1;
}

message GetWebsiteScoreResponse {
    int32 status_code = 1;
    float score = 2;
}

message GetMonitoringRegistryRequest {
    int32 monitoring_registry_id = 1;
}

message GetMonitoringRegistryResponse {
    int32 status_code = 1;
    int32 id = 2;
    string accessibility_metric = 3;
    string main_url = 4;
    string domain_name = 5;
    bool is_mobile = 6;
    bool is_landscape = 7;
    int32 display_width = 8;
    int32 display_height = 9;
    repeated string webpages = 10;
    string latest_evaluation = 11;
    float accessibility_score = 12;
}

message GetIssuesStatsRequest {
    int32 monitoring_registry_id = 1;
}

message GetIssuesStatsResponse {
    int32 status_code = 1;
    int32 passed = 2;
    int32 warnings = 3;
    int32 failed = 4;
    int32 inapplicable = 5;
}

message GetWebpageScreenshotRequest {
    int32 evaluation_id = 1;
}

message GetWebpageScreenshotResponse {
    int32 status_code = 1;
    bytes screenshot = 2;
}

message GetLatestEvaluationsRequest {
    int32 monitoring_id = 1;
}

message GetLatestEvaluationsResponse {
    int32 status_code = 1;
    repeated EvaluationIdUrl evaluations = 2;
}

message EvaluationIdUrl {
    int32 evaluation_id = 1;
    string evaluation_url = 2;
}

message GetLatestACTAssertionsRequest {
    int32 evaluation_id = 1;
    repeated string wcagLevelFilters = 2;
    string outcome = 3;
}

message GetLatestACTAssertionsResponse {
    int32 status_code = 1;
    repeated AssertionResponse assertions = 2;
}

message AssertionResponse {
    int32 assertion_id = 1;
    string assertion_name = 2;
    string assertion_rule = 3;
    int32 evaluation_id = 4;
    string webpage_url = 5;
}

message GetAssertionResultsRequest {
    int32 assertion_id = 1;
}

message GetAssertionResultsResponse {
    int32 status_code = 1;
    repeated ResultResponse results = 2;
}

message ResultResponse {
    int32 id = 1;
    string description = 2;
    string verdict = 3;
}

message GetResultElementsRequest {
    int32 issue_id = 1;
}

message GetResultElementsResponse{
    int32 status_code = 1;
    ElementResponse element = 2;
}

message ElementResponse {
    int32 id = 1;
    string html_code = 2;
    string pointer = 3;
    float x = 4;
    float y = 5;
    float width = 6;
    float height = 7;
}

message GetEvaluationHistoryRequest {
    int32 monitoring_id = 1;
}

message GetEvaluationHistoryResponse {
    int32 status_code = 1;
    repeated EvaluationHistory history = 2;
}

message EvaluationHistory {
    int32 id = 1;
    string title = 2;
    string input_url = 3;
    float score = 4;
    EvalDate eval_date = 5;
}

message EvalDate {
    int32 day = 1;
    int32 month = 2;
    int32 year = 3;
}

message GetUserMonitoringRegistriesRequest {
    int32 user_id = 2;
}

message GetUserMonitoringRegistriesResponse {
    int32 status_code = 1;
    repeated MonitoringRegistry monitoring_registries = 2;
}

message MonitoringRegistry {
    int32 id = 1;
    string accessibility_metric = 2;
    string name = 3;
    string main_url = 4;
    bool is_mobile = 5;
    bool is_landscape = 6;
    int32 display_width = 7;
    int32 display_height = 8;
    repeated string webpages = 9;
    EvalDate latest_evaluation = 10;
    float score = 11;
    int32 passed = 12;
    int32 warnings = 13;
    int32 failed = 14;
    int32 inapplicable = 15;
}

message GetWebsiteMonitoringCyclesRequest {
    int32 monitoring_id = 1;
}

message GetWebsiteMonitoringCyclesResponse {
    int32 status_code = 1;
    repeated MonitoringCycle monitoring_cycles = 2;
}

message MonitoringCycle {
    int32 id = 1;
    EvalDate cycle_date = 2;
}

message SetNewMonitoringCycleRequest {
    int32 monitoring_registry_id = 1;
}

message SetNewMonitoringCycleResponse {
    int32 status_code = 1;
    int32 monitoring_cycle_id = 2;
}

message GetMonitoredWebpagesRequest {
    int32 monitoring_registry_id = 1;
}

message GetMonitoredWebpagesResponse {
    int32 status_code = 1;
    repeated Webpage monitored_webpages = 2;
}

message Webpage {
    int32 id = 1;
    string url = 2;
}

message GetEvaluationInfoRequest {
    int32 monitoring_registry_id = 1;
    int32 webpage_id = 2;
}

message GetEvaluationInfoResponse {
    int32 status_code = 1;
    int32 display_width = 2;
    int32 display_height = 3;
    bool is_mobile = 4;
    bool is_landscape = 5;
    string webpage_url = 6;
}

service Evaluations {
    rpc AddMonitoringRegistry(AddMonitoringRegistryRequest) returns (AddMonitoringRegistryResponse);
    rpc AddEvaluation(AddEvaluationRequest) returns (AddEvaluationResponse);
    rpc GetMonitoredWebsites(GetMonitoredWebsitesRequest) returns (GetMonitoredWebsitesResponse);
    rpc SetAccessibilityMetric(SetAccessibilityMetricRequest) returns (SetAccessibilityMetricResponse);
    rpc CalculateAccessibilityScore(CalculateAccessibilityScoreRequest) returns (CalculateAccessibilityScoreResponse);
    rpc SetLatestEvaluation(SetLatestEvaluationRequest) returns (SetLatestEvaluationResponse);
    rpc AddWebpages(AddWebpagesRequest) returns (AddWebpagesResponse);
    rpc SetAccessibilityMetricAllWebsites(SetAccessibilityMetricAllWebsitesRequest) returns (SetAccessibilityMetricAllWebsitesResponse);
    rpc GetLatestAssertionsByWebpage(GetLatestAssertionsByWebpageRequest) returns (GetLatestAssertionsByWebpageResponse);
    rpc GetLatestAssertionsByTest(GetLatestAssertionsByTestRequest) returns (GetLatestAssertionsByTestResponse);
    rpc GetCurrentWarnings(GetCurrentWarningsRequest) returns (GetCurrentWarningsResponse);
    rpc GetWebsiteScore(GetWebsiteScoreRequest) returns (GetWebsiteScoreResponse);
    rpc GetMonitoringRegistry(GetMonitoringRegistryRequest) returns (GetMonitoringRegistryResponse);
    rpc GetIssuesStats(GetIssuesStatsRequest) returns (GetIssuesStatsResponse);
    rpc GetWebpageScreenshot(GetWebpageScreenshotRequest) returns (GetWebpageScreenshotResponse);
    rpc GetLatestEvaluations(GetLatestEvaluationsRequest) returns (GetLatestEvaluationsResponse);
    rpc GetLatestACTAssertions(GetLatestACTAssertionsRequest) returns (GetLatestACTAssertionsResponse);
    rpc GetAssertionResults (GetAssertionResultsRequest) returns (GetAssertionResultsResponse);
    rpc GetResultElement (GetResultElementsRequest) returns (GetResultElementsResponse);
    rpc GetEvaluationHistory (GetEvaluationHistoryRequest) returns (GetEvaluationHistoryResponse);
    rpc GetUserMonitoringRegistries (GetUserMonitoringRegistriesRequest) returns (GetUserMonitoringRegistriesResponse);
    rpc GetWebsiteMonitoringCycles (GetWebsiteMonitoringCyclesRequest) returns (GetWebsiteMonitoringCyclesResponse);
    rpc SetNewMonitoringCycle (SetNewMonitoringCycleRequest) returns (SetNewMonitoringCycleResponse);
    rpc GetMonitoredWebpages (GetMonitoredWebpagesRequest) returns (GetMonitoredWebpagesResponse);
    rpc GetEvaluationInfo (GetEvaluationInfoRequest) returns (GetEvaluationInfoResponse);
}